<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-editable="title">{{title}} - {{groom_name}} & {{bride_name}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==================== RESET & VARIABLES ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-gold: #D4AF37;
            --light-gold: #F4E4BC;
            --dark-gold: #B8860B;
            --pure-white: #FFFFFF;
            --off-white: #FEFEFE;
            --light-gray: #F8F9FA;
            --medium-gray: #6C757D;
            --dark-gray: #343A40;
            --charcoal: #2C3E50;
            --shadow-light: rgba(0,0,0,0.05);
            --shadow-medium: rgba(0,0,0,0.1);
            --shadow-dark: rgba(0,0,0,0.15);
        }
        
        body {
            font-family: "Montserrat", sans-serif;
            background: var(--pure-white);
            color: var(--dark-gray);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* ==================== LOADING SCREEN ==================== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--pure-white) 0%, var(--light-gray) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            animation: fadeOut 1s ease 3s forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }
        }
        
        .loading-rings {
            width: 80px;
            height: 80px;
            position: relative;
        }
