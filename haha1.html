<!DOCTYPE html>
<html>
<head>
    <title>Universal Template Preview (Pro)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2c3e50;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: white;
        }
        .container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }
        /* Cột bên trái: Editor */
        .editor-panel {
            flex: 1;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        /* Cột bên phải: Preview */
        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            background: #ecf0f1;
            padding: 40px;
            border-radius: 10px;
            overflow: auto;
            height: 90vh;
            background-image: radial-gradient(#bdc3c7 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .canvas {
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            margin: 0 auto;
            background: white;
            transition: all 0.3s ease;
            overflow: hidden; /* Cắt các phần thừa (mây bay) */
        }
        
        .element {
            position: absolute;
            box-sizing: border-box; /* Quan trọng để tính viền đúng */
        }
        
        h2 { margin-top: 0; color: #ecf0f1; }
        
        textarea {
            width: 100%;
            flex: 1;
            margin-top: 10px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            border: none;
            border-radius: 5px;
            background: #2c3e50;
            color: #bdc3c7;
            resize: none;
            outline: none;
        }
        textarea:focus { background: #233242; color: #fff; }
        
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-run { background: #27ae60; color: white; }
        .btn-run:hover { background: #219150; }
        .btn-copy { background: #2980b9; color: white; }
        .btn-copy:hover { background: #2472a4; }

        /* --- XỬ LÝ LỖI SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2c3e50; }
        ::-webkit-scrollbar-thumb { background: #7f8c8d; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="editor-panel">
            <h2>🛠 Design Data (JSON)</h2>
            <div style="font-size: 12px; color: #bdc3c7; margin-bottom: 5px;">Paste JSON từ database vào đây:</div>
            <textarea id="jsonInput" spellcheck="false"></textarea>
            <div class="btn-group">
                <button class="btn-run" onclick="renderTemplate()"><i class="fa-solid fa-play"></i> Render Preview</button>
                <button class="btn-copy" onclick="copySQL()"><i class="fa-solid fa-database"></i> Copy SQL Insert</button>
            </div>
        </div>

        <div class="preview-panel">
            <div id="canvas" class="canvas"></div>
        </div>
    </div>

    <script>
        // --- 1. MẪU MẶC ĐỊNH (ULTIMATE PASSPORT) ---
        // Để bạn thấy sự khác biệt ngay khi mở lên
        const defaultData = {
            "fonts": [
                "https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&family=Montserrat:wght@400;600;700&family=Courier+Prime&family=Libre+Barcode+39+Text&display=swap"
            ],
            "globalStyles": ".gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; background-clip: text; color: transparent !important; text-shadow: 0px 1px 1px rgba(0,0,0,0.1); } .stamp-effect { mix-blend-mode: multiply; opacity: 0.85; transform: rotate(-15deg); border: 3px double #c0392b; color: #c0392b; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.3); } @keyframes floatCloud { 0% { transform: translate(-100px, 0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translate(400px, 20px); opacity: 0; } } .anim-cloud { animation: floatCloud 25s linear infinite; } .paper-texture { background-image: url('data:image/svg+xml,%3Csvg viewBox=%270 0 200 200%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27noiseFilter%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.8%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23noiseFilter)%27 opacity=%270.08%27/%3E%3C/svg%3E'); opacity: 0.4; pointer-events: none; }",
            "canvas": {
                "width": 390,
                "height": 850,
                "background": "#fdfbf7"
            },
            "elements": [
                { "id": "bg-tex", "type": "shape", "x": 0, "y": 0, "width": 390, "height": 850, "fill": "transparent", "className": "paper-texture", "zIndex": 99 },
                { "id": "top-navy", "type": "shape", "shapeType": "rectangle", "x": 0, "y": 0, "width": 390, "height": 200, "fill": "#1a2639", "zIndex": 1 },
                { "id": "title", "type": "text", "content": "PASSPORT\nTO LOVE", "x": 0, "y": 50, "width": 390, "height": 80, "fontSize": 32, "fontFamily": "Cinzel", "fontWeight": "700", "textAlign": "center", "className": "gold-text", "zIndex": 2 },
                { "id": "names", "type": "text", "content": "Hoàng Nam & Minh Thư", "x": 0, "y": 400, "width": 390, "height": 50, "fontSize": 30, "fontFamily": "Great Vibes", "color": "#1a2639", "textAlign": "center", "zIndex": 2 },
                { "id": "stamp", "type": "text", "content": "APPROVED", "x": 250, "y": 350, "width": 80, "height": 80, "fontSize": 10, "fontFamily": "Courier Prime", "className": "stamp-effect", "zIndex": 5 },
                 { "id": "cloud", "type": "image", "url": "https://cdn-icons-png.flaticon.com/512/414/414927.png", "x": -50, "y": 150, "width": 100, "height": 60, "className": "anim-cloud", "zIndex": 10 }
            ]
        };

        window.onload = function() {
            document.getElementById('jsonInput').value = JSON.stringify(defaultData, null, 2);
            renderTemplate();
        };

        // --- 2. ENGINE RENDER ĐA NĂNG (QUAN TRỌNG) ---
        function renderTemplate() {
            try {
                const inputVal = document.getElementById('jsonInput').value;
                if (!inputVal.trim()) return;

                const data = JSON.parse(inputVal);
                const canvas = document.getElementById('canvas');

                // --- BƯỚC A: RESET & LOAD TÀI NGUYÊN (Fonts & Styles) ---
                canvas.innerHTML = '';
                
                // 1. Inject Fonts
                if (data.fonts) {
                    data.fonts.forEach(url => {
                        if (!document.querySelector(`link[href="${url}"]`)) {
                            const link = document.createElement('link');
                            link.rel = 'stylesheet';
                            link.href = url;
                            document.head.appendChild(link);
                        }
                    });
                }

                // 2. Inject CSS Global (Cho hiệu ứng vàng, mây bay...)
                const styleId = 'custom-design-styles';
                let styleTag = document.getElementById(styleId);
                if (data.globalStyles) {
                    if (!styleTag) {
                        styleTag = document.createElement('style');
                        styleTag.id = styleId;
                        document.head.appendChild(styleTag);
                    }
                    styleTag.textContent = data.globalStyles;
                } else if (styleTag) {
                    // Nếu JSON không có style thì xóa style cũ đi để tránh lỗi
                    styleTag.textContent = '';
                }

                // --- BƯỚC B: VẼ CANVAS ---
                canvas.style.width = data.canvas.width + 'px';
                canvas.style.height = data.canvas.height + 'px';
                canvas.style.background = data.canvas.background;

                // Sort layer
                const sorted = (data.elements || []).sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));

                sorted.forEach(el => {
                    if (el.visible === false) return;

                    const div = document.createElement('div');
                    div.className = 'element';
                    if (el.className) div.classList.add(el.className); // Thêm class hiệu ứng nếu có

                    // Style vị trí cơ bản
                    div.style.left = el.x + 'px';
                    div.style.top = el.y + 'px';
                    div.style.width = el.width + 'px';
                    div.style.height = el.height + 'px';
                    div.style.zIndex = el.zIndex || 0;
                    if (el.rotation) div.style.transform = `rotate(${el.rotation}deg)`;
                    if (el.opacity !== undefined) div.style.opacity = el.opacity;
                    if (el.boxShadow) div.style.boxShadow = el.boxShadow;
                    if (el.borderRadius) div.style.borderRadius = el.borderRadius + 'px';

                    // Xử lý TEXT
                    if (el.type === 'text') {
                        div.innerText = el.content;
                        div.style.fontSize = el.fontSize + 'px';
                        div.style.fontFamily = el.fontFamily || 'Arial';
                        div.style.color = el.color; // Nếu có class .gold-text thì màu này sẽ bị ghi đè thành transparent
                        div.style.fontWeight = el.fontWeight;
                        div.style.fontStyle = el.fontStyle;
                        div.style.textAlign = el.textAlign;
                        div.style.textDecoration = el.textDecoration;
                        div.style.lineHeight = el.lineHeight || 1.2;
                        div.style.letterSpacing = (el.letterSpacing || 0) + 'px';
                        
                        // Căn giữa text trong box
                        div.style.display = 'flex';
                        div.style.alignItems = 'center'; // Vertical align
                        div.style.justifyContent = el.textAlign === 'center' ? 'center' : (el.textAlign === 'right' ? 'flex-end' : 'flex-start');
                        div.style.whiteSpace = 'pre-wrap';
                    }
                    // Xử lý IMAGE
                    else if (el.type === 'image') {
                        const img = document.createElement('img');
                        img.src = el.url;
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        if (el.borderRadius) img.style.borderRadius = el.borderRadius + 'px';
                        div.appendChild(img);
                    }
                    // Xử lý SHAPE
                    else if (el.type === 'shape') {
                        div.style.background = el.fill;
                        if (el.stroke) div.style.border = `${el.strokeWidth}px solid ${el.stroke}`;
                        if (el.shapeType === 'circle') div.style.borderRadius = '50%';
                    }

                    canvas.appendChild(div);
                });

            } catch (error) {
                alert('❌ JSON Error: ' + error.message);
                console.error(error);
            }
        }

        function copySQL() {
            try {
                const json = document.getElementById('jsonInput').value;
                const data = JSON.parse(json);
                const escapedJson = JSON.stringify(data).replace(/'/g, "\\'");
                
                const sql = `INSERT INTO \`templates\` (\`uuid\`, \`name\`, \`slug\`, \`description\`, \`thumbnail_url\`, \`category_id\`, \`is_premium\`, \`design_data\`, \`tags\`, \`is_active\`, \`created_at\`, \`updated_at\`) VALUES (UUID(), 'New Template', 'new-template-slug', 'Description here', 'https://via.placeholder.com/500', 1, 1, '${escapedJson}', '[]', 1, NOW(), NOW());`;
                
                navigator.clipboard.writeText(sql).then(() => alert('✅ SQL đã copy!'));
            } catch (e) {
                alert('JSON không hợp lệ!');
            }
        }
    </script>
</body>
</html>
