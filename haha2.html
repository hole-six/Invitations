            --bg-editor: #1e1e1e;
            --sidebar-width: 450px;
            --accent-color: #d4af37; /* Gold */

        }

        /* --- GLOBAL RESET & LAYOUT --- */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #121212; /* Dark Theme Background */
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- LEFT SIDE: IDE / EDITOR (Professional Look) --- */
        .editor-pane {
            width: var(--sidebar-width);
            background: var(--bg-editor);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .editor-header {
            padding: 20px;
            background: #252526;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .editor-header h2 {
            margin: 0;
            font-size: 16px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge {
            background: var(--accent-color);
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }
        .code-area {
            flex: 1;
            position: relative;
            background: #1e1e1e;
            overflow: hidden;
        }
        textarea#jsonInput {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 20px;
            font-family: 'Courier Prime', monospace; /* Monospace font like VS Code */
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        /* Custom Scrollbar for Editor */
        textarea::-webkit-scrollbar { width: 10px; }
        textarea::-webkit-scrollbar-track { background: #1e1e1e; }
        textarea::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #555; }

        .editor-footer {
            padding: 15px;
            background: #252526;
            border-top: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
        }
        .btn-refresh { background: #0e639c; color: white; }
        .btn-refresh:hover { background: #1177bb; }
        .btn-copy { background: #2d2d2d; color: #ccc; border: 1px solid #444; }
        .btn-copy:hover { background: #3d3d3d; color: white; }

        /* --- RIGHT SIDE: PREVIEW CANVAS --- */

            flex: 1;
            background: url('https://images.unsplash.com/photo-1519750783826-e2420f4d687f?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden; /* For floating elements */
        }
        /* Overlay to darken background image */
        .preview-pane::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }

        /* THE PHONE MOCKUP */
        .phone-frame {
            position: relative;
            width: 415px; /* Border included */
            height: 850px;
            background: #000;
            border-radius: 50px;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 0 2px #333;
            border: 12px solid #111;
            overflow: hidden;
            z-index: 5;
            transition: transform 0.3s ease;
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #111;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }
        .canvas-scroll-wrapper {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: #fdfbf7;
            /* Hide scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .canvas-scroll-wrapper::-webkit-scrollbar { display: none; }

        /* THE RENDER CANVAS */
        #canvas {
            position: relative;
            margin: 0 auto;
            overflow: hidden;
            transform-origin: top left;
            /* Noise texture for paper feel */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }

        /* --- SPECIAL EFFECTS CLASSES (Used by JS Renderer) --- */
        .element {
            position: absolute;
            box-sizing: border-box;
            transition: transform 0.3s ease; /* Smooth hover effects if needed */
        }
        
        /* Gold Foil Effect */
        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
            text-shadow: 0px 1px 1px rgba(0,0,0,0.2);
        }

        /* Air Mail Border Animation */
        @keyframes border-march {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        /* Floating Cloud Animation */
        @keyframes floatCloud {
            0% { transform: translateX(-100%) translateY(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateX(450px) translateY(20px); opacity: 0; }
        }
        .anim-cloud {
            animation: floatCloud 25s linear infinite;
        }
        
        /* Stamp Ink Effect */
        .stamp-effect {
            mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxmaWx0ZXIgaWQ9Im5vaXNlIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMSIgbnVtT2N0YXZlcz0iMSIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNub2lzZSkiIG9wYWNpdHk9IjAuNSIvPjwvc3ZnPg==");
            mask-mode: alpha;
            opacity: 0.85;
            mix-blend-mode: multiply;
        }

        window.onload = function() {
            const input = document.getElementById('jsonInput');
            input.value = JSON.stringify(worldThemeTemplate, null, 2);

        function renderTemplate() {
            try {
                const json = document.getElementById('jsonInput').value;
                const data = JSON.parse(json);
                const canvas = document.getElementById('canvas');
                
                // Clear previous
                canvas.innerHTML = '';
                
                // 1. Setup Canvas Attributes
                canvas.style.width = data.canvas.width + 'px';
                canvas.style.height = data.canvas.height + 'px';
                canvas.style.backgroundColor = data.canvas.background;
                
                // 2. Sort Elements by zIndex (Layering)
                const sortedElements = data.elements.sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0));
                
                // 3. Render Loop
                sortedElements.forEach(el => {
                    if (el.visible === false) return;

                    const domEl = document.createElement('div');
                    domEl.className = 'element ' + (el.className || '');
                    domEl.id = el.id;

                    // Basic Positioning
                    domEl.style.left = `${el.x}px`;
                    domEl.style.top = `${el.y}px`;
                    domEl.style.width = `${el.width}px`;
                    domEl.style.height = `${el.height}px`;
                    
                    // Transforms
                    if (el.rotation) domEl.style.transform = `rotate(${el.rotation}deg)`;
                    if (el.opacity !== undefined) domEl.style.opacity = el.opacity;
                    if (el.zIndex) domEl.style.zIndex = el.zIndex;

                    // Specific Type Handling
                    if (el.type === 'text') {
                        domEl.textContent = el.content;
                        domEl.style.fontSize = `${el.fontSize}px`;
                        domEl.style.fontFamily = el.fontFamily || 'Montserrat';
                        domEl.style.fontWeight = el.fontWeight || 'normal';
                        domEl.style.fontStyle = el.fontStyle || 'normal';
                        domEl.style.color = el.color || '#000';
                        domEl.style.textAlign = el.textAlign || 'left';
                        domEl.style.letterSpacing = `${el.letterSpacing || 0}px`;
                        domEl.style.lineHeight = el.lineHeight || 1.2;
                        
                        // Flex centering for text boxes
                        domEl.style.display = 'flex';
                        domEl.style.flexDirection = 'column';
                        domEl.style.justifyContent = 'center';
                        // Horizontal align
                        if(el.textAlign === 'center') domEl.style.alignItems = 'center';
                        else if(el.textAlign === 'right') domEl.style.alignItems = 'flex-end';
                        else domEl.style.alignItems = 'flex-start';

                        domEl.style.whiteSpace = 'pre-wrap';
                    } 
                    else if (el.type === 'image') {
                        const img = document.createElement('img');
                        img.src = el.url;
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        img.style.display = 'block';
                        if (el.borderRadius) img.style.borderRadius = `${el.borderRadius}px`;
                        domEl.appendChild(img);
                    } 
                    else if (el.type === 'shape') {
                        domEl.style.background = el.fill || 'transparent';
                        if (el.stroke) {
                            domEl.style.border = `${el.strokeWidth || 1}px ${el.strokeDasharray ? 'dashed' : 'solid'} ${el.stroke}`;
                        }
                        if (el.borderRadius) domEl.style.borderRadius = `${el.borderRadius}px`;
                        if (el.boxShadow) domEl.style.boxShadow = el.boxShadow;
                        
                        if (el.shapeType === 'circle') {
                            domEl.style.borderRadius = '50%';
                        }
                    }

                    // Special Animation Delay override
                    if (el.animationDelay) {
                        domEl.style.animationDelay = el.animationDelay;
                    }

                    canvas.appendChild(domEl);
                });

            } catch (err) {
                console.error(err);
                alert("JSON Error: " + err.message);
            }
        }

        function copySQL() {
            const json = document.getElementById('jsonInput').value;
            // Escape single quotes for SQL
            const escapedJson = JSON.stringify(JSON.parse(json)).replace(/'/g, "\\'");
            
            const sql = `
INSERT INTO templates (
    uuid, name, slug, description, thumbnail_url, category_id,
    is_premium, design_data, tags, is_active, created_at, updated_at
) VALUES (
    UUID(),
    'Ultimate Passport Luxury',
    'ultimate-passport-invitation',
    'World class travel themed wedding invitation with gold foil and stamps.',
    'https://images.unsplash.com/photo-1544642899-f0d6e5f6ed6f?w=500',
    1, 1,
    '${escapedJson}',
    '["passport", "travel", "gold", "luxury"]',
    1, NOW(), NOW()
);`;
            navigator.clipboard.writeText(sql).then(() => alert("SQL đã được copy!"));
        }
    </script>
