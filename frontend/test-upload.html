<!DOCTYPE html>
<html>
<head>
    <title>Test Upload API</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        button { padding: 10px 20px; margin: 10px 0; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test HiWeb Upload API</h1>
    
    <div>
        <label>Select small image (< 100KB): </label>
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <button onclick="testUpload()">Test Upload</button>
    
    <h2>Console Output:</h2>
    <pre id="output"></pre>
    
    <script>
        const token = localStorage.getItem('userToken');
        const output = document.getElementById('output');
        
        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            output.innerHTML += `<div class="${className}">[${timestamp}] ${msg}</div>`;
        }
        
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first!');
                return;
            }
            
            output.innerHTML = '';
            log(`Testing upload for: ${file.name}`);
            log(`File size: ${file.size} bytes (${(file.size/1024).toFixed(2)} KB)`);
            log(`File type: ${file.type}`);
            log(`Token: ${token ? 'Present' : 'MISSING!'}`);
            
            if (!token) {
                log('ERROR: No token found! Please login first.', 'error');
                return;
            }
            
            // Test 1: Upload with FormData (file field)
            log('\n--- Test 1: FormData with "file" field ---');
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                log('Sending POST to /system/upload...');
                const response = await fetch('/system/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': token
                    },
                    body: formData
                });
                
                log(`Response status: ${response.status} ${response.statusText}`);
                const text = await response.text();
                log(`Response body: ${text}`);
                
                if (response.ok) {
                    log('✅ SUCCESS!', 'success');
                    const data = JSON.parse(text);
                    log(`File key: ${data.data?.file_key || 'N/A'}`);
                    log(`URL: ${data.data?.url || data.data?.final_url || 'N/A'}`);
                } else {
                    log('❌ FAILED', 'error');
                }
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
            }
            
            // Test 2: Upload with FormData (image field)
            log('\n--- Test 2: FormData with "image" field ---');
            try {
                const formData = new FormData();
                formData.append('image', file);
                
                log('Sending POST to /system/upload...');
                const response = await fetch('/system/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': token
                    },
                    body: formData
                });
                
                log(`Response status: ${response.status} ${response.statusText}`);
                const text = await response.text();
                log(`Response body: ${text}`);
                
                if (response.ok) {
                    log('✅ SUCCESS!', 'success');
                } else {
                    log('❌ FAILED', 'error');
                }
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
            }
            
            // Test 3: Check user profile for quota info
            log('\n--- Test 3: Get user profile (check quota) ---');
            try {
                const response = await fetch('/user/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': token,
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`Response status: ${response.status}`);
                const data = await response.json();
                
                if (data.data) {
                    const user = data.data;
                    log(`Max file size: ${user.max_file_size} bytes (${(user.max_file_size/1024/1024).toFixed(2)} MB)`);
                    log(`Max total size: ${user.max_total_size} bytes (${(user.max_total_size/1024/1024).toFixed(2)} MB)`);
                    log(`Used size: ${user.used_size} bytes (${(user.used_size/1024/1024).toFixed(2)} MB)`);
                    log(`Available: ${((user.max_total_size - user.used_size)/1024/1024).toFixed(2)} MB`);
                    
                    if (file.size > user.max_file_size) {
                        log(`⚠️ File too large! Max: ${(user.max_file_size/1024/1024).toFixed(2)} MB`, 'error');
                    }
                    if (user.used_size + file.size > user.max_total_size) {
                        log(`⚠️ Quota exceeded! Need: ${((user.used_size + file.size)/1024/1024).toFixed(2)} MB`, 'error');
                    }
                }
            } catch (error) {
                log(`❌ ERROR: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
