<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mẫu thiệp 119</title>

    


    


    <!-- BỘ TỐI ƯU GIAO DIỆN & FIX LỖI (Antigravity Global Fix V2) -->
    <style id="premium-design-system">
        /* Khắc phục lỗi tràn viền màn hình và thanh cuộn ngang */
        html, body {
            overflow-x: hidden !important;
            max-width: 100vw !important;
            scroll-behavior: smooth;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }

        /* TỰ ĐỘNG SCALE GIAO DIỆN VỪA MỌI MÀN HÌNH ĐIỆN THOẠI (FIX BỂ FORM CỰC ĐỈNH) */
        @media only screen and (max-width: 600px) {
            .view-port {
                width: 100vw !important;
                /* Tính toán tỷ lệ scale dựa trên khung 568px gốc của editor */
                transform: scale(calc(100vw / 568)) !important;
                transform-origin: top center !important;
                margin: 0 auto !important;
                height: auto !important;
                /* Bỏ padding top dư thừa */
                padding-top: 0 !important; 
            }
            /* Đảm bảo khung cha chứa view-port không bị giới hạn chiều cao gây mất đuôi thiệp */
            #root, .full-page {
                height: auto !important;
                min-height: 100vh !important;
            }
        }

        /* Căn giữa thiệp trên nền Desktop */
        @media only screen and (min-width: 601px) {
            .view-port {
                margin: 0 auto !important;
                box-shadow: 0 0 30px rgba(0,0,0,0.15);
                border-radius: 8px;
            }
        }

        .resizer-container {
            max-width: 100% !important;
            overflow: hidden !important;
        }

        /* Đảm bảo hình ảnh không bị méo */
        img {
            object-fit: cover !important;
            max-width: 100% !important;
        }

        /* ========================================================
           THIẾT KẾ LẠI FORM (HỘP MỪNG CƯỚI / RSVP / SỔ LƯU BÚT)
           ======================================================== */
        
        .invite-form-container, #wish-form, .guestbook-form, .rsvp-form {
            background: rgba(255, 255, 255, 0.92) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-radius: 24px !important;
            padding: 30px 24px !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(0,0,0,0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.9) !important;
            box-sizing: border-box !important;
            width: 90% !important;
            max-width: 600px !important;
            margin: 0 auto !important;
            position: relative;
        }

        .invite-form-container .MuiStack-root, #wish-form .mb-3 {
            margin-bottom: 18px !important;
            margin-top: 0 !important;
        }

        .invite-form-container label.MuiFormLabel-root, #wish-form label {
            font-weight: 700 !important;
            color: #4b5563 !important;
            margin-bottom: 8px !important;
            position: relative !important;
            transform: none !important;
            display: inline-block !important;
            font-size: 15px !important;
            font-family: 'Inter', 'Quicksand', sans-serif !important;
        }

        .invite-form-container input.MuiInputBase-input, 
        .invite-form-container textarea, 
        .invite-form-container select,
        .invite-form-container .MuiSelect-select,
        #wish-form input,
        #wish-form textarea,
        #wish-form select {
            border-radius: 12px !important;
            border: 2px solid #e5e7eb !important;
            background: #ffffff !important;
            padding: 14px 16px !important;
            font-family: 'Inter', 'Quicksand', sans-serif !important;
            font-size: 16px !important;
            color: #1f2937 !important;
            transition: all 0.25s ease !important;
            width: 100% !important;
            box-sizing: border-box !important;
            height: auto !important;
        }

        .invite-form-container fieldset { display: none !important; }
        .invite-form-container .MuiInputBase-root { padding: 0 !important; background: transparent !important; }
        .invite-form-container .MuiOutlinedInput-notchedOutline { border: none !important; }

        .invite-form-container input.MuiInputBase-input:focus, 
        .invite-form-container textarea:focus, 
        .invite-form-container .MuiSelect-select:focus,
        #wish-form input:focus,
        #wish-form textarea:focus,
        #wish-form select:focus {
            border-color: #8b5cf6 !important;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15) !important;
            outline: none !important;
        }

        .invite-form-container button[type="submit"],
        #wish-form button[type="submit"] {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 14px !important;
            padding: 16px 24px !important;
            font-weight: 800 !important;
            font-size: 17px !important;
            cursor: pointer !important;
            font-family: 'Inter', 'Quicksand', sans-serif !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            width: 100% !important;
            margin-top: 16px !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3) !important;
        }

        .invite-form-container button[type="submit"]:hover,
        #wish-form button[type="submit"]:hover {
            transform: translateY(-4px) !important;
            box-shadow: 0 12px 25px rgba(244, 63, 94, 0.4) !important;
            background: linear-gradient(135deg, #fb7185 0%, #fda4af 100%) !important;
        }

        .invite-form-container button[type="submit"]:active,
        #wish-form button[type="submit"]:active {
            transform: translateY(0) !important;
        }
    </style>

</head>
<body>
    <!-- Paste mã HTML của mẫu 119 vào đây -->
</body>
</html>
